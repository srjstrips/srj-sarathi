# SRJ Sarthi HRMS — production
# All containers prefixed: srj_sarthi_*
# Ports confirmed free on VPS (checked against live docker ps 2026-09-06):
#   3001 → API, 3006 → Web, 9010/9011 → MinIO
# Postgres & Redis are internal only (no host port exposure)

services:
  postgres:
    image: postgres:16-alpine
    container_name: srj_sarthi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: srj_sarthi
      POSTGRES_PASSWORD: j5s5VpW_P9lBDo9ENLSzrPMQnXsIxp1e
      POSTGRES_DB: srj_sarthi_hrms
    volumes:
      - srj_sarthi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U srj_sarthi -d srj_sarthi_hrms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srj_sarthi_net

  redis:
    image: redis:7-alpine
    container_name: srj_sarthi_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass He-Gtnap2lnJnmZ21RK4OTxYkWSnRFYa
    volumes:
      - srj_sarthi_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'He-Gtnap2lnJnmZ21RK4OTxYkWSnRFYa', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srj_sarthi_net

  minio:
    image: minio/minio:latest
    container_name: srj_sarthi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: srj_sarthi_minio
      MINIO_ROOT_PASSWORD: -BJGWs_1w9DtyBK0229MDbXyNJs8BSUv
    volumes:
      - srj_sarthi_minio_data:/data
    ports:
      - '9010:9000'
      - '9011:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - srj_sarthi_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: srj_sarthi_api
    container_name: srj_sarthi_api
    restart: unless-stopped
    ports:
      - '3011:3001'
    env_file:
      - apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - srj_sarthi_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://72.62.228.27:3011
    image: srj_sarthi_web
    container_name: srj_sarthi_web
    restart: unless-stopped
    ports:
      - '3006:3002'
    depends_on:
      - api
    networks:
      - srj_sarthi_net

volumes:
  srj_sarthi_postgres_data:
  srj_sarthi_redis_data:
  srj_sarthi_minio_data:

networks:
  srj_sarthi_net:
    name: srj_sarthi_net
